<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login • Desain Solid</title>
    <!-- Font Awesome 6 (gratis) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            // tidak ada gradient, semua solid
            colors: {
              // warna kustom solid (opsional)
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
    <!-- Kartu login – solid, tidak ada gradien -->
    <div
      class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-6 md:p-8 transition-all"
    >
      <!-- Judul / ikon -->
      <div class="text-center mb-6">
        <div
          class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 text-white text-3xl rounded-full"
        >
          <i class="fas fa-user-lock"></i>
        </div>
        <h1 class="text-2xl font-semibold text-slate-800 mt-3">Masuk</h1>
        <p class="text-sm text-slate-500 mt-1">
          Silakan login dengan akun Anda
        </p>
      </div>

      <!-- Form login -->
      <form class="space-y-5" onsubmit="return false;">
        <!-- Field username -->
        <div>
          <label
            class="block text-sm font-medium text-slate-700 mb-1"
            for="username"
          >
            <i class="fas fa-user text-blue-600 mr-1"></i> Username
          </label>
          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"
            >
              <i class="fas fa-user"></i>
            </span>
            <input
              type="text"
              id="username"
              value="demo_user"
              class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition text-slate-800"
              placeholder="Masukkan username"
            />
          </div>
        </div>

        <!-- Field password -->
        <div>
          <label
            class="block text-sm font-medium text-slate-700 mb-1"
            for="password"
          >
            <i class="fas fa-lock text-blue-600 mr-1"></i> Password
          </label>
          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"
            >
              <i class="fas fa-key"></i>
            </span>
            <input
              type="password"
              id="password"
              value="password_salah"
              class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition text-slate-800"
              placeholder="Masukkan password"
            />
          </div>
        </div>

        <!-- Pesan error (password/username salah) – selalu tampil sesuai permintaan -->
        <div
          class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 px-4 py-2.5 rounded-xl text-sm"
        >
          <i class="fas fa-circle-exclamation text-red-500"></i>
          <span
            ><strong>Login gagal.</strong> Username atau password salah.</span
          >
        </div>

        <!-- Tombol login (solid) -->
        <button
          type="button"
          class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-2.5 rounded-xl transition-colors flex items-center justify-center gap-2"
        >
          <i class="fas fa-arrow-right-to-bracket"></i> Masuk
        </button>

        <!-- Opsi tambahan (lupa password / daftar) -->
        <div
          class="flex flex-col sm:flex-row justify-between text-sm text-slate-600 pt-1 gap-2"
        >
          <a
            href="#"
            class="hover:text-blue-600 transition flex items-center gap-1"
          >
            <i class="fas fa-question-circle"></i> Lupa password?
          </a>
          <a
            href="#"
            class="hover:text-blue-600 transition flex items-center gap-1"
          >
            <i class="fas fa-user-plus"></i> Daftar akun
          </a>
        </div>
      </form>

      <!-- Footer kecil -->
      <p class="text-xs text-slate-400 text-center mt-6">
        <i class="fas fa-shield-halved mr-1"></i> Aman & terpercaya
      </p>
    </div>
  </body>
</html>
